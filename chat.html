<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Сайт специально для Вари</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        
        .widget-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .code-checker {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 2px solid #4caf50;
        }
        
        .code-checker label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .code-checker input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        .code-checker input:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        .output-text {
            margin-top: 15px;
            padding: 20px;
            background: #fff8e1;
            border-left: 4px solid #ff9800;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            font-family: 'Georgia', serif;
            display: none;
            white-space: pre-line;
        }
        
        .output-text.show {
            display: block;
        }
    </style>
</head>
<body>
