<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Чат для меня и Вари</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        
        .widget-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .chat-messages {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            height: 400px;
            overflow-y: auto;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        
        .message.me {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .message.her {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
        }
        
        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .message.me .message-time {
            text-align: right;
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .chat-input button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-status {
            font-size: 12px;
            color: #888;
            padding: 5px 10px;
            min-height: 30px;
        }
        
        nav ul {
            list-style: none;
            padding: 0;
        }
        
        nav ul li {
            display: inline;
            margin-right: 15px;
        }
        
        nav ul li a {
            text-decoration: none;
            color: #667eea;
        }
    </style>
</head>
<body>

<h1>💬 Чат для меня и Вари</h1>

<div class="widget-container">
    <div><a href="https://allcalc.ru/node/2336" data-weight="450px" data-height="400px">Сколько дней осталось до 21 июня - до моей с тобой встречи</a><script src="https://allcalc.ru/widgets/script.js"></script></div>
</div>

<div class="widget-container">
    <div><a href="https://allcalc.ru/node/2392" data-weight="450px" data-height="400px">Сколько дней осталось до 16 августа - до твоего дня рождения</a><script src="https://allcalc.ru/widgets/script.js"></script></div>
</div>

<!-- Чат -->
<div class="chat-messages" id="messages"></div>
<div class="typing-status" id="typingStatus"></div>
<div class="chat-input">
    <input type="text" id="messageInput" placeholder="Напиши Варе..." onkeypress="handleKeyPress(event)">
    <button id="sendBtn" onclick="sendMessage()">📤 Отправить</button>
</div>

<div class="widget-container">
    <nav>
        <ul>
            <li><a href="/for-V/index.html">Главная</a></li>
        </ul>
    </nav>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
    // Генерируем уникальный ID для этой пары
    function getPairId() {
        let pairId = localStorage.getItem('chat_pair_id');
        if (!pairId) {
            pairId = 'pair_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chat_pair_id', pairId);
        }
        return pairId;
    }
    
    const ROOM_ID = getPairId();
    
    let peer = null;
    let connection = null;
    let connected = false;
    let typingTimeout = null;
    
    const messagesDiv = document.getElementById('messages');
    const typingStatus = document.getElementById('typingStatus');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    function addMessage(text, isMe = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMe ? 'me' : 'her'}`;
        
        const time = new Date().toLocaleTimeString().slice(0,5);
        
        messageDiv.innerHTML = `
            <div>${escapeHtml(text)}</div>
            <div class="message-time">${time}</div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function addSystemMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        messageDiv.style.textAlign = 'center';
        messageDiv.style.background = 'transparent';
        messageDiv.style.fontSize = '12px';
        messageDiv.style.color = '#888';
        messageDiv.style.maxWidth = '100%';
        messageDiv.innerHTML = text;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !connected || !connection) return;
        
        connection.send({ type: 'message', text: text });
        addMessage(text, true);
        messageInput.value = '';
        stopTyping();
    }
    
    function handleKeyPress(event) {
        if (event.key === 'Enter' && connected) {
            sendMessage();
        } else if (connected) {
            startTyping();
        }
    }
    
    function startTyping() {
        if (!connected || !connection) return;
        if (typingTimeout) clearTimeout(typingTimeout);
        
        connection.send({ type: 'typing', isTyping: true });
        typingTimeout = setTimeout(() => {
            stopTyping();
        }, 1500);
    }
    
    function stopTyping() {
        if (!connected || !connection) return;
        connection.send({ type: 'typing', isTyping: false });
    }
    
    function setupConnection(conn) {
        if (connection === conn) return;
        if (connection) connection.close();
        
        connection = conn;
        
        connection.on('open', () => {
            connected = true;
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
            addSystemMessage('✨ Соединение установлено ✨');
        });
        
        connection.on('data', (data) => {
            if (data.type === 'message') {
                addMessage(data.text, false);
            } else if (data.type === 'typing') {
                typingStatus.innerHTML = data.isTyping ? 'Варя печатает... ✍️' : '';
            }
        });
        
        connection.on('close', () => {
            connected = false;
            sendBtn.disabled = true;
            messageInput.disabled = true;
            addSystemMessage('💔 Связь потеряна 💔');
            connection = null;
        });
    }
    
    function tryConnect() {
        if (connection && connected) return;
        const conn = peer.connect(ROOM_ID);
        if (conn) {
            setupConnection(conn);
        }
    }
    
    // ЗАПУСК
    peer = new Peer(ROOM_ID, {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    });
    
    peer.on('open', () => {
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });
        tryConnect();
    });
    
    peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
            tryConnect();
        }
    });
    
    // Отключаем автоподстановку текста при фокусе
    messageInput.addEventListener('focus', () => {
        if (connected && messageInput.value === 'Напиши Варе...') {
            messageInput.value = '';
        }
    });
</script>

</body>
</html>
